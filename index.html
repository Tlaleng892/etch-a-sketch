<!DOCTYPE html>
<html>
<head>
  <title>Etch-a-Sketch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Etch-a-Sketch 🎨</h1>

  <div class="controls">
    <button id="blackBtn">Black</button>
    <button id="rainbowBtn">Rainbow 🌈</button>
    <button id="shadingBtn">Shading ✏️</button>
    <button id="eraserBtn">Eraser 🧹</button>
    <button id="clearBtn">Clear</button>
    <button id="gridBtn">Grid Lines: ON</button>
    <button id="saveBtn">Save 📸</button>
  </div>

  <div class="controls">
    <label>Draw Colour:</label>
    <input type="color" id="colorPicker" value="#ff00ff">
    <label>Page Colour:</label>
    <input type="color" id="bgPicker" value="#ffc0cb">
  </div>

  <div class="controls">
    <label>Grid Size: <span id="sizeLabel">16 x 16</span></label><br>
    <input type="range" id="sizeSlider" min="1" max="64" value="16">
  </div>

  <div id="container"></div>

  <script src="script.js"></script>
</body>
</html>
